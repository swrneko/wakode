[package]
name = "wakode-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
axum-extra = { workspace = true, features = ["cookie"] }
# Разбор схемы `Basic` в рабочем коде без base64 не обходится. Это не
# криптография: вся она живёт в `wakode-auth`.
base64.workspace = true
chrono-tz.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "net"] }
tower-http = { workspace = true, features = ["catch-panic", "trace"] }
tracing.workspace = true
# `serde` — ради ответа настройки: идентификатор заведённого администратора
# уезжает клиенту в JSON.
uuid = { workspace = true, features = ["v7", "serde"] }
wakode-auth.workspace = true
wakode-core.workspace = true
wakode-store.workspace = true

[dev-dependencies]
http-body-util = "0.1"
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tower = { workspace = true, features = ["util"] }
# Только ради тестов журнала: они читают то, что подписчик действительно
# напечатал, — иначе «в лог не попадает» проверялось бы рассуждением.
tracing-subscriber.workspace = true
